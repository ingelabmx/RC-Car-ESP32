<svg viewBox="0 0 1180 968" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="968" fill="#ffffff"/>

  <text x="590" y="30" font-size="19" font-weight="bold" fill="#1F4E79" text-anchor="middle">Diagrama de conexiones — Seeed XIAO ESP32-S3 + FS-GR3E + TB6612FNG + ESC BDESC-S10E</text>
  <text x="590" y="50" font-size="12" fill="#666" text-anchor="middle">TX: FlySky FS-GT3C · Batería NiMH 7.2V · Motor dirección 10 Ω · Pot 5 kΩ · Lógica 3.3V</text>

  <!-- LEYENDA -->
  <rect x="880" y="70" width="290" height="170" rx="6" fill="#fdfdfd" stroke="#bbb"/>
  <text x="895" y="90" font-size="12" font-weight="bold" fill="#333">Leyenda</text>
  <line x1="895" y1="105" x2="935" y2="105" stroke="#c0392b" stroke-width="3.5"/>
  <text x="945" y="109" font-size="11" fill="#333">Potencia +7.2V</text>
  <line x1="895" y1="125" x2="935" y2="125" stroke="#000" stroke-width="3.5"/>
  <text x="945" y="129" font-size="11" fill="#333">GND</text>
  <line x1="895" y1="145" x2="935" y2="145" stroke="#e67e22" stroke-width="2.5"/>
  <text x="945" y="149" font-size="11" fill="#333">+5V (BEC del ESC)</text>
  <line x1="895" y1="165" x2="935" y2="165" stroke="#2471a3" stroke-width="2.5"/>
  <text x="945" y="169" font-size="11" fill="#333">Señal lógica</text>
  <line x1="895" y1="185" x2="935" y2="185" stroke="#7d3c98" stroke-width="3.5"/>
  <text x="945" y="189" font-size="11" fill="#333">Salida a motor</text>
  <line x1="895" y1="205" x2="935" y2="205" stroke="#16a085" stroke-width="2.5"/>
  <text x="945" y="209" font-size="11" fill="#333">+3.3V (pin 3V3 del XIAO)</text>
  <circle cx="915" cy="225" r="4" fill="#333"/>
  <text x="935" y="229" font-size="10" fill="#333">Punto = unión (cruce sin punto no conecta)</text>

  <!-- BATERIA -->
  <rect x="40" y="90" width="130" height="90" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="105" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">BATERÍA</text>
  <text x="105" y="140" font-size="12" text-anchor="middle" fill="#333">NiMH 7.2V</text>
  <text x="105" y="157" font-size="11" text-anchor="middle" fill="#666">3000 mAh</text>

  <!-- ESC -->
  <rect x="290" y="80" width="210" height="180" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="395" y="108" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">ESC BDESC-S10E</text>
  <text x="395" y="126" font-size="11" text-anchor="middle" fill="#666">5-9 NiMH · BEC 5V/2A</text>
  <text x="298" y="150" font-size="10" fill="#c0392b">BAT +</text>
  <text x="298" y="180" font-size="10" fill="#333">BAT −</text>
  <text x="492" y="150" font-size="10" text-anchor="end" fill="#7d3c98">MOT A</text>
  <text x="492" y="180" font-size="10" text-anchor="end" fill="#7d3c98">MOT B</text>
  <rect x="330" y="215" width="90" height="34" rx="4" fill="#fff" stroke="#888"/>
  <text x="375" y="230" font-size="9" text-anchor="middle" fill="#666">cable servo</text>
  <text x="375" y="243" font-size="9" text-anchor="middle" fill="#666">blanco/rojo/negro</text>

  <!-- SW1: interruptor principal en serie con B+ -->
  <line x1="170" y1="145" x2="182" y2="145" stroke="#c0392b" stroke-width="3.5"/>
  <circle cx="185" cy="145" r="3" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <line x1="187" y1="144" x2="214" y2="131" stroke="#c0392b" stroke-width="3"/>
  <circle cx="217" cy="145" r="3" fill="#fff" stroke="#c0392b" stroke-width="2"/>
  <line x1="220" y1="145" x2="290" y2="145" stroke="#c0392b" stroke-width="3.5"/>
  <text x="201" y="111" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">SW1</text>
  <text x="201" y="123" font-size="9" text-anchor="middle" fill="#c0392b">≥20A DC</text>
  <line x1="170" y1="175" x2="290" y2="175" stroke="#000" stroke-width="3.5"/>

  <!-- Bus +7.2V hacia VM -->
  <circle cx="240" cy="145" r="4" fill="#c0392b"/>
  <polyline points="240,145 240,470 590,470" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="585" y="464" font-size="10" text-anchor="end" fill="#c0392b">+7.2V</text>
  <!-- Bus GND -->
  <circle cx="240" cy="175" r="4" fill="#000"/>
  <polyline points="240,175 210,175 210,500 590,500" fill="none" stroke="#000" stroke-width="3"/>
  <text x="585" y="494" font-size="10" text-anchor="end" fill="#333">GND común</text>

  <!-- Traccion: 2 motores en paralelo -->
  <rect x="650" y="68" width="215" height="194" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="757" y="86" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1F4E79">TRACCIÓN · 2 en paralelo</text>
  <!-- MOT A -> rojos -->
  <polyline points="500,145 590,145" fill="none" stroke="#7d3c98" stroke-width="3.5"/>
  <line x1="590" y1="117" x2="590" y2="207" stroke="#7d3c98" stroke-width="3"/>
  <circle cx="590" cy="145" r="4.5" fill="#7d3c98"/>
  <line x1="590" y1="117" x2="684" y2="117" stroke="#7d3c98" stroke-width="3"/>
  <line x1="590" y1="207" x2="684" y2="207" stroke="#7d3c98" stroke-width="3"/>
  <!-- MOT B -> negros -->
  <polyline points="500,175 620,175" fill="none" stroke="#7d3c98" stroke-width="3.5"/>
  <line x1="620" y1="133" x2="620" y2="223" stroke="#7d3c98" stroke-width="3"/>
  <circle cx="620" cy="175" r="4.5" fill="#7d3c98"/>
  <line x1="620" y1="133" x2="684" y2="133" stroke="#7d3c98" stroke-width="3"/>
  <line x1="620" y1="223" x2="684" y2="223" stroke="#7d3c98" stroke-width="3"/>
  <!-- Motor 1 -->
  <circle cx="710" cy="125" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="710" y="131" font-size="15" font-weight="bold" text-anchor="middle">M1</text>
  <text x="745" y="120" font-size="10" fill="#333">Motor trasero</text>
  <text x="745" y="134" font-size="9" fill="#666">rojo → MOT A</text>
  <text x="745" y="146" font-size="9" fill="#666">negro → MOT B</text>
  <!-- Motor 2 -->
  <circle cx="710" cy="215" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="710" y="221" font-size="15" font-weight="bold" text-anchor="middle">M2</text>
  <text x="745" y="210" font-size="10" fill="#333">Motor delantero</text>
  <text x="745" y="224" font-size="9" fill="#666">rojo → MOT A</text>
  <text x="745" y="236" font-size="9" fill="#666">negro → MOT B</text>
  <text x="757" y="256" font-size="8.5" text-anchor="middle" fill="#888">verificar que ambos ejes giren igual</text>

  <!-- ================= GR3E (4 filas) ================= -->
  <rect x="290" y="285" width="210" height="173" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="395" y="302" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">RECEPTOR FS-GR3E</text>
  <text x="395" y="317" font-size="10" text-anchor="middle" fill="#666">enlazado con FS-GT3C</text>
  <!-- encabezado columnas -->
  <text x="420" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#2471a3">S</text>
  <text x="445" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">+</text>
  <text x="470" y="336" font-size="10" font-weight="bold" text-anchor="middle" fill="#333">−</text>
  <!-- etiquetas de fila -->
  <text x="300" y="356" font-size="11" font-weight="bold" fill="#333">VCC</text>
  <text x="300" y="381" font-size="11" font-weight="bold" fill="#333">BIND/CH3</text>
  <text x="300" y="406" font-size="11" font-weight="bold" fill="#333">CH2</text>
  <text x="300" y="431" font-size="11" font-weight="bold" fill="#333">CH1</text>
  <!-- pines -->
  <g fill="#888">
    <circle cx="420" cy="352" r="3.5"/><circle cx="445" cy="352" r="3.5"/><circle cx="470" cy="352" r="3.5"/>
    <circle cx="420" cy="377" r="3.5"/><circle cx="445" cy="377" r="3.5"/><circle cx="470" cy="377" r="3.5"/>
    <circle cx="420" cy="402" r="3.5"/><circle cx="445" cy="402" r="3.5"/><circle cx="470" cy="402" r="3.5"/>
    <circle cx="420" cy="427" r="3.5"/><circle cx="445" cy="427" r="3.5"/><circle cx="470" cy="427" r="3.5"/>
  </g>
  <!-- BIND/CH3: vacío -->
  <rect x="410" y="370" width="70" height="14" rx="3" fill="none" stroke="#aaa" stroke-dasharray="3,2"/>
  <text x="395" y="453" font-size="8.5" text-anchor="middle" fill="#888">BIND/CH3 vacío (bind plug solo al enlazar)</text>

  <!-- VCC: conector con + y − hacia 5V / GND -->
  <rect x="435" y="345" width="50" height="14" rx="3" fill="#f5cba7" stroke="#e67e22"/>
  <line x1="485" y1="349" x2="530" y2="349" stroke="#e67e22" stroke-width="2.5"/>
  <line x1="485" y1="356" x2="545" y2="356" stroke="#000" stroke-width="2.5"/>
  <!-- VCC + -> 5V del XIAO -->
  <polyline points="530,349 530,530 70,530 70,600" fill="none" stroke="#e67e22" stroke-width="2.5"/>
  <text x="250" y="524" font-size="10" fill="#e67e22">+5V BEC → pin 5V del XIAO</text>
  <!-- VCC − -> bus GND -->
  <polyline points="545,356 545,500" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="545" cy="500" r="4" fill="#000"/>

  <!-- CH2: conector completo del ESC -->
  <rect x="410" y="395" width="75" height="14" rx="3" fill="#d6eaf8" stroke="#2471a3"/>
  <polyline points="375,249 375,272 560,272 560,402 485,402" fill="none" stroke="#2471a3" stroke-width="2.5"/>
  <text x="568" y="340" font-size="10" fill="#2471a3">cable servo del ESC</text>
  <text x="568" y="353" font-size="10" fill="#2471a3">→ CH2 (S / + / −)</text>

  <!-- CH1: solo S -> D2 -->
  <rect x="413" y="420" width="14" height="14" rx="2" fill="#d6eaf8" stroke="#2471a3"/>
  <polyline points="420,434 420,440 515,440 515,660 240,660" fill="none" stroke="#2471a3" stroke-width="2.5"/>
  <text x="290" y="653" font-size="10" fill="#2471a3">CH1 · S → D1</text>
  <text x="410" y="653" font-size="9" fill="#2471a3">sin transistor</text>
  <text x="408" y="678" font-size="9" fill="#888">(+ y − de CH1 sin conectar)</text>

  <!-- GND del XIAO al bus -->
  <circle cx="210" cy="500" r="4" fill="#000"/>
  <polyline points="210,500 210,560 110,560 110,600" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ================= ARDUINO NANO ================= -->
  <rect x="40" y="600" width="200" height="240" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="70" y="614" font-size="9" text-anchor="middle" fill="#e67e22">5V</text>
  <text x="110" y="614" font-size="9" text-anchor="middle" fill="#333">GND</text>
  <text x="140" y="632" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">Seeed XIAO ESP32-S3</text>
  <text x="140" y="646" font-size="9.5" text-anchor="middle" fill="#666">(lógica 3.3V · ADC 12 bits)</text>
  <text x="232" y="664" font-size="10" text-anchor="end" fill="#2471a3">D1 (GPIO2)</text>
  <text x="232" y="720" font-size="10" text-anchor="end" fill="#2471a3">D3 (GPIO4) PWM 20kHz</text>
  <text x="232" y="745" font-size="10" text-anchor="end" fill="#2471a3">D4 (GPIO5)</text>
  <text x="232" y="770" font-size="10" text-anchor="end" fill="#2471a3">D5 (GPIO6)</text>
  <text x="232" y="796" font-size="10" font-weight="bold" text-anchor="end" fill="#16a085">3V3</text>
  <text x="232" y="812" font-size="10" text-anchor="end" fill="#27ae60">D0 (GPIO1)</text>
  <text x="232" y="828" font-size="10" text-anchor="end" fill="#333">GND</text>

  <!-- XIAO -> TB6612 señales -->
  <line x1="240" y1="716" x2="590" y2="716" stroke="#2471a3" stroke-width="2.5"/>
  <line x1="240" y1="741" x2="590" y2="741" stroke="#2471a3" stroke-width="2.5"/>
  <line x1="240" y1="766" x2="590" y2="766" stroke="#2471a3" stroke-width="2.5"/>

  <!-- Red 3V3 del XIAO: TB6612 VCC + STBY y pot ROJO -->
  <polyline points="240,792 400,792 400,545 590,545" fill="none" stroke="#16a085" stroke-width="2.5"/>
  <line x1="400" y1="570" x2="590" y2="570" stroke="#16a085" stroke-width="2.5"/>
  <circle cx="400" cy="570" r="4" fill="#16a085"/>
  <circle cx="400" cy="792" r="4" fill="#16a085"/>
  <text x="408" y="600" font-size="9.5" font-weight="bold" fill="#16a085">+3.3V</text>

  <!-- ================= TB6612 ================= -->
  <rect x="590" y="440" width="190" height="335" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="685" y="470" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">TB6612FNG</text>
  <text x="598" y="474" font-size="10" fill="#c0392b">VM</text>
  <text x="598" y="504" font-size="10" fill="#333">GND</text>
  <text x="598" y="549" font-size="10" fill="#16a085">VCC</text>
  <text x="598" y="574" font-size="10" fill="#16a085">STBY</text>
  <text x="598" y="720" font-size="10" fill="#2471a3">PWMA</text>
  <text x="598" y="745" font-size="10" fill="#2471a3">AIN1</text>
  <text x="598" y="770" font-size="10" fill="#2471a3">AIN2</text>
  <text x="772" y="624" font-size="10" text-anchor="end" fill="#7d3c98">AO1</text>
  <text x="772" y="654" font-size="10" text-anchor="end" fill="#7d3c98">AO2</text>
  <text x="685" y="690" font-size="9" text-anchor="middle" fill="#999">canal B sin usar</text>

  <!-- ================= DIRECCION 5 HILOS ================= -->
  <rect x="870" y="440" width="280" height="345" rx="8" fill="#eef3f8" stroke="#1F4E79" stroke-width="2"/>
  <text x="1010" y="468" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F4E79">DIRECCIÓN (5 hilos)</text>

  <circle cx="940" cy="620" r="26" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="940" y="627" font-size="16" font-weight="bold" text-anchor="middle">M</text>
  <text x="1000" y="608" font-size="11" fill="#333">Motor dirección</text>
  <text x="1000" y="624" font-size="10" fill="#666">AMARILLO → AO1</text>
  <text x="1000" y="639" font-size="10" fill="#666">NEGRO → AO2</text>
  <line x1="780" y1="620" x2="914" y2="614" stroke="#d4ac0d" stroke-width="3.5"/>
  <line x1="780" y1="650" x2="914" y2="632" stroke="#333" stroke-width="3.5"/>

  <rect x="915" y="690" width="50" height="65" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="940" y1="690" x2="940" y2="680" stroke="#c0392b" stroke-width="2"/>
  <line x1="940" y1="755" x2="940" y2="765" stroke="#000" stroke-width="2"/>
  <polyline points="900,722 922,722 932,714" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="1000" y="700" font-size="11" fill="#333">Pot 5 kΩ</text>
  <text x="1000" y="716" font-size="10" fill="#666">ROJO → 3V3</text>
  <text x="1000" y="731" font-size="10" fill="#666">VERDE → D0</text>
  <text x="1000" y="746" font-size="10" fill="#666">BLANCO → GND</text>

  <!-- Pot rojo -> 3V3 del XIAO -->
  <polyline points="940,680 830,680 830,792 400,792" fill="none" stroke="#16a085" stroke-width="2"/>
  <!-- Pot verde -> D0 -->
  <polyline points="900,722 850,722 850,808 240,808" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Pot blanco -> GND del XIAO -->
  <polyline points="940,765 860,765 860,824 240,824" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- ================= ADVERTENCIAS ================= -->
  <rect x="40" y="858" width="1110" height="98" rx="5" fill="#fff8e1" stroke="#e6b800"/>
  <text x="55" y="876" font-size="11" font-weight="bold" fill="#8a6d00">⚠ Quita el bind plug que viene estacionado en CH1 (puentea S con −) antes de conectar D1. Para enlazar, va en BIND/CH3 — nunca en VCC.</text>
  <text x="55" y="893" font-size="11" fill="#8a6d00">⚠ GND común obligatorio: batería, ESC, GR3E, XIAO, TB6612 y pot. Failsafe solo existe en CH2 (acelerador): configúralo a neutro.</text>
  <text x="55" y="910" font-size="11" fill="#8a6d00">⚠ El pot y la lógica del TB6612 van al 3V3 del XIAO, NUNCA a 5V (dañaría el ADC). El BEC entra solo al pin 5V del XIAO. Al programar por USB-C, desconecta el BEC.</text>
  <text x="55" y="927" font-size="11" fill="#8a6d00">⚠ Tracción: si un eje gira al revés del otro, invierte solo los cables de ESE motor en el empalme. Si ambos van al revés del gatillo, usa REV de CH2 en el GT3C.</text>
  <text x="55" y="944" font-size="11" fill="#8a6d00">⚠ SW1 en serie con B+ ANTES de toda derivación: apaga ESC, BEC, receptor, XIAO y VM del TB6612. Rating mínimo 20A en DC (no basta un rating AC).</text>
</svg>
